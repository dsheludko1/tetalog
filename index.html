<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TETA</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#1b2433;--muted:#5d6b82;--accent:#2f6bff;--accent-t:#fff;--line:#e3e8f1;--warn:#fff3d6;--warn-t:#5e4200;--code:#eef2fb;--ok:#1a8a4a;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--card:#1a2230;--text:#eef2f9;--muted:#9aa8bf;--accent:#6b97ff;--accent-t:#0b1220;--line:#2a3447;--warn:#2d2616;--warn-t:#f2d58a;--code:#243049;--ok:#5fd68f;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151f;--card:#1a2230;--text:#eef2f9;--muted:#9aa8bf;--accent:#6b97ff;--accent-t:#0b1220;--line:#2a3447;--warn:#2d2616;--warn-t:#f2d58a;--code:#243049;--ok:#5fd68f;--err:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
.langs{display:flex;gap:8px;margin-bottom:14px}
button{font-family:inherit;cursor:pointer}
.langs button{flex:1;padding:10px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-weight:600;font-size:.95rem}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
h1{font-size:1.6rem;line-height:1.2;margin:8px 0 6px}
.lead{color:var(--muted);margin:0 0 20px}
ol{list-style:none;margin:0;padding:0;display:grid;gap:12px}
ol>li{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-t);font-weight:700;display:grid;place-items:center}
.b{min-width:0;flex:1}
h2{font-size:1.05rem;margin:0 0 4px}
.b p{margin:0 0 8px;color:var(--muted);font-size:.98rem}
label.f{display:block;font-size:.88rem;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number]{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:11px 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:.95rem}
.seg input:checked+span{background:var(--accent);color:var(--accent-t);border-color:var(--accent);font-weight:600}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.seg label{position:relative}
.hint{font-size:.85rem;color:var(--muted);margin:10px 0 0!important}
.err{color:var(--err)!important;font-weight:600}
.res{margin-top:14px;display:grid;gap:10px}
.empty{background:var(--code);border-radius:10px;padding:12px;color:var(--muted);font-size:.92rem;margin:0}
.out{background:var(--code);border-radius:12px;padding:10px 12px}
.out small{display:block;color:var(--muted);font-size:.8rem}
.out code{display:block;font:600 .98rem ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere;margin:2px 0 8px;color:var(--text)}
.cp{width:100%;padding:10px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-t);font-weight:600;font-size:.95rem}
.cp.ok{background:var(--ok);color:#fff}
a{color:var(--accent);font-weight:600;overflow-wrap:anywhere}
.box{margin-top:18px;border-radius:16px;padding:16px}
.box h2{margin:0 0 8px}
.box ul{margin:0;padding-left:20px}
.warn{background:var(--warn);color:var(--warn-t)}
.help{background:var(--card);border:1px solid var(--line)}
.prog{display:flex;flex-direction:column;gap:6px;margin:6px 0 14px;color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.card>h2{font-size:1.25rem;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 14px}
.row{display:flex;gap:12px;align-items:flex-start;margin:14px 0}
.row p{margin:0}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1;padding:14px;border-radius:12px;font-size:1rem;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--text)}
.nav .pri{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
.go{display:block;text-align:center;margin-top:16px;padding:16px;border-radius:14px;background:var(--accent);color:var(--accent-t);text-decoration:none;font-size:1.1rem}
.card .help{margin-top:16px}
.ms{background:#fff;color:#222;border:1px solid #d0d5dd;border-radius:12px;padding:16px;font-family:"Segoe UI",system-ui,sans-serif;max-width:320px;margin:12px auto 0;display:flex;flex-direction:column;gap:8px;position:relative}
.ms .em{display:block;height:9px;width:62%;background:#c9ced6;border-radius:5px;margin-bottom:6px}
.ms small{color:#666;font-size:.78rem}
.ms b{font-size:1.1rem;line-height:1.25}
.ms .sh{width:54px;height:60px;margin:2px auto;background:linear-gradient(#0a78d4,#2fb4f0);border-radius:26px 26px 30px 30px/22px 22px 36px 36px}
.ms p{margin:0;font-size:.82rem;color:#333}
.ms .st{border:1px solid #999;border-radius:6px;padding:6px 10px;width:max-content;font-size:.8rem}
.ms u{color:#0067b8;font-size:.85rem;text-decoration:none;display:inline-block;width:max-content;max-width:100%;position:relative}
.ms u.hi{margin-bottom:24px}
.ms .nx{align-self:flex-end;background:#0067b8;color:#fff;padding:6px 16px;font-size:.82rem;opacity:.55}
.ms .doc{border:1px solid #ddd;padding:10px;font-size:.8rem}
.ms .bt{display:flex;gap:10px;margin-top:6px;margin-bottom:22px}
.ms .bt span{padding:8px 12px;font-size:.82rem;border:1px solid #888}
.ms .bt .ac{background:#0067b8;color:#fff;border-color:#0067b8;position:relative}
.hi{outline:2px solid #e8590c;outline-offset:3px;border-radius:3px}
.hi::after{content:"";position:absolute;inset:-6px;border:2px solid #e8590c;border-radius:6px;animation:pl 1.4s ease-out infinite}
.hi em{position:absolute;right:-6px;bottom:-30px;font-style:normal;font-size:1.6rem;animation:tp 1.4s ease-in-out infinite}
@keyframes pl{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.25);opacity:0}}
@keyframes tp{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px) scale(.92)}}
@media (prefers-reduced-motion:reduce){.hi::after,.hi em{animation:none}}
.cap{color:var(--muted);font-size:.8rem;text-align:center;margin:8px 0 0}
.hero{text-align:center;padding:8px 4px 16px}
.hero .ic{font-size:2.6rem;display:block;line-height:1.2}
.hero h2{font-size:1.35rem;margin:6px 0}
.hero p{margin:0;color:var(--muted)}
.info{display:flex;gap:12px;align-items:flex-start;padding:14px;margin-top:10px;background:var(--code);border-radius:14px}
.info .ic{font-size:1.6rem;line-height:1}
.info h3{margin:0 0 2px;font-size:1rem}
.info p{margin:0;color:var(--muted);font-size:.95rem}
.info.key{background:transparent;border:2px solid var(--accent)}
.ms .fld{border-bottom:2px solid #0067b8;padding:8px 0;color:#777;font-size:.85rem;position:relative}
.ms .btn{align-self:flex-end;background:#0067b8;color:#fff;padding:7px 18px;font-size:.85rem;position:relative}
.ms .btn.hi{margin-bottom:28px}
.ms .opt{border:1px solid #888;padding:8px;font-size:.82rem;margin-top:6px}
</style>
</head>

</main>

var lang="pl",S={n:"",s:"",l:"",t:"a",y:String(new Date().getFullYear())};
function li(a){return a.map(function(x){return "<li>"+x+"</li>"}).join("")}
function clean(x){return x.trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ł/g,"l").replace(/Ł/g,"L").replace(/[\s'’]/g,"")}
function esc(x){return x.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
var St=0;
function calc(){
var d=T[lang];
if(/[\u0400-\u04FF]/.test(S.n+S.s+S.l))return {m:d.lat,e:1};
var wl=function(x){return x.trim().split(/\s+/).map(clean).filter(Boolean)};
var ns=wl(S.n),ss=wl(S.s),lg=clean(S.l).toLowerCase(),n="",s="",ok=false;
if(ns.length&&ss.length){n=ns[0];s=ss[ss.length-1];
if(lg.length>1){var c=lg.charAt(0),rest=lg.slice(1);
var fn=ns.filter(function(w){return w.toLowerCase().charAt(0)===c})[0];
var fs=ss.filter(function(w){var x=w.toLowerCase();return x===rest||x.indexOf(rest)===0})[0];
if(fn&&fs){n=fn;s=fs;ok=true}}}
if(!n||!s||lg.length<2)return {m:d.em};
if(!/^\d{4}$/.test(S.y))return {m:d.yerr,e:1};
var cap=function(x){return x.charAt(0).toUpperCase()+x.slice(1)};
return {ok:ok,nm:cap(n)+" "+cap(s),login:(n+"."+s).toLowerCase()+(S.t==="a"?"@aptdc.answear.com":"@dc.answear.com"),pw:"Pass@Ress*"+n.charAt(0).toUpperCase()+s.charAt(0).toUpperCase()+"!"+S.y};
}
function creds(c){var d=T[lang];return (c.ok?"":'<p class="empty err">'+d.nf+'</p>')+'<p class="hint" style="margin:0!important">'+d.us+" <b>"+esc(c.nm)+"</b></p>"+box(d.rl,c.login)+box(d.rp,c.pw)}
function msg(c){return '<p class="empty'+(c.e?" err":"")+'">'+c.m+'</p>'}
function pre(c){var d=T[lang];return (c.ok?"":'<p class="empty err">'+d.nf+'</p>')+'<p class="hint" style="margin:0!important">'+d.us+" <b>"+esc(c.nm)+"</b></p><p class=\"empty\">"+d.rd+"</p>"}
function update(){
var c=calc(),r=document.getElementById("res");
if(r)r.innerHTML=c.login?pre(c):msg(c);
var nx=document.getElementById("nx");
if(nx&&St===2)nx.disabled=!c.login;
}
function sub(t,d){return t.replace("{o}",d.oth).replace("{a}",d.acc)}
function auth(d){return '<div class="ms" aria-hidden="true"><i class="em"></i><small>'+d.ms1+'</small><b>'+d.ms2+'</b><div class="sh"></div><p>'+d.ms3+'</p><div class="st">App Store</div><u>'+d.l1+'</u><u class="hi">'+d.oth+'<em>👆</em></u><span class="nx">'+d.nxt+'</span></div><p class="cap">'+d.cap+'</p>'}
function terms(d){return '<div class="ms" aria-hidden="true"><i class="em"></i><b>'+d.tt+'</b><div class="doc">Answear.com S.A.</div><div class="bt"><span>'+d.dec+'</span><span class="ac hi">'+d.acc+'<em>👆</em></span></div></div><p class="cap">'+d.cap+'</p>'}
function sub2(t,d){return t.replace("{n}",d.nxt).replace("{x}",d.sio).replace("{s}",d.sin)}
function login1(d){return '<div class="ms" aria-hidden="true"><i class="em"></i><b>'+d.si+'</b><div class="fld hi">'+d.ph+'</div><u>'+d.cant+'</u><span class="btn hi">'+d.nxt+'<em>👆</em></span><div class="opt">🔑 '+d.sio+'</div></div>'}
function login2(d){return '<div class="ms" aria-hidden="true"><i class="em"></i><b>'+d.pt+'</b><div class="fld hi">••••••••••••</div><u>'+d.forgot+'</u><span class="btn hi">'+d.sin+'<em>👆</em></span></div>'}
function render(){
var d=T[lang],c=calc();
document.documentElement.lang=lang;document.title="TETA – "+d.t;
document.querySelectorAll("#langs button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===lang)});
var h='<h1>'+d.t+'</h1><div class="prog"><span>'+d.st+" "+(St+1)+" "+d.of+' 8</span><div class="bar"><i style="width:'+Math.round((St+1)*100/8)+'%"></i></div></div><div class="card">';
if(St===0){h+='<div class="hero"><span class="ic">📅</span><h2>'+d.i0t+'</h2><p>'+d.i0l+'</p></div><div class="info"><span class="ic">🕒</span><div><h3>'+d.i1t+'</h3><p>'+d.i1x+'</p></div></div><div class="info key"><span class="ic">👤</span><div><h3>'+d.i2t+'</h3><p>'+d.i2x+'</p></div></div>'}
if(St===1){h+='<h2>'+d.s1+'</h2><p class="sub">'+d.s1t+'</p><section class="box warn" style="margin-top:0"><h2>'+d.w+'</h2><ul>'+li(d.wl)+'</ul></section>'}
if(St===2){h+='<h2>'+d.a+'</h2>'+
'<label class="f" for="fn">'+d.nm+'</label><input type="text" id="fn" autocomplete="off" autocapitalize="words" spellcheck="false" value="'+esc(S.n).replace(/"/g,"&quot;")+'">'+
'<label class="f" for="fs">'+d.sn+'</label><input type="text" id="fs" autocomplete="off" autocapitalize="words" spellcheck="false" value="'+esc(S.s).replace(/"/g,"&quot;")+'">'+
'<label class="f" for="fl">'+d.lg+'</label><input type="text" id="fl" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="dpas" value="'+esc(S.l).replace(/"/g,"&quot;")+'"><p class="hint" style="margin-top:4px!important">'+d.lh+'</p>'+
'<label class="f">'+d.ty+'</label><div class="seg"><label><input type="radio" name="t" value="a"'+(S.t==="a"?" checked":"")+'><span>'+d.ta+'</span></label><label><input type="radio" name="t" value="b"'+(S.t==="b"?" checked":"")+'><span>'+d.tb+'</span></label></div>'+
'<label class="f" for="fy">'+d.yr+'</label><input type="number" id="fy" inputmode="numeric" min="2000" max="2100" value="'+S.y+'">'+
'<p class="hint">'+d.hint+'</p><div class="res" id="res"></div>'}
if(St===3){h+='<h2>'+d.l0t+'</h2><p class="sub">'+d.l0x+'</p><div class="row"><span class="n">1</span><p>'+sub2(d.l1,d)+'</p></div>'+login1(d)+'<div class="row"><span class="n">2</span><p>'+sub2(d.l2,d)+'</p></div>'+login2(d)+'<p class="cap">'+d.cap+'</p>'}
if(St===4){h+='<h2>'+d.f1t+'</h2><p class="sub">'+sub(d.f1x,d)+'</p>'+auth(d)}
if(St===5){h+='<h2>'+d.f2t+'</h2><p class="sub">'+sub(d.f2x,d)+'</p>'+auth(d)}
if(St===6){h+='<h2>'+d.f3t+'</h2><p class="sub">'+sub(d.f3x,d)+'</p>'+terms(d)}
if(St===7){h+='<h2>'+d.s4+'</h2><p class="sub">'+d.s4t+'</p><div class="res">'+(c.login?creds(c):msg(c))+'</div><a class="go" href="https://teta.ansbbq.com" target="_blank" rel="noopener">'+d.op+' ↗</a><section class="box help"><h2>'+d.h+'</h2><ul>'+li(d.hl)+'</ul></section>'}
h+='</div><div class="nav">'+(St>0?'<button id="bk">'+d.bk+'</button>':"")+(St<7?'<button class="pri" id="nx">'+d.nx+'</button>':"")+'</div>';
document.getElementById("app").innerHTML=h;
update();
}
function box(l,v){return '<div class="out"><small>'+l+'</small><code>'+esc(v)+'</code><button class="cp" data-copy="'+esc(v)+'">'+T[lang].cp+'</button></div>'}
function copy(t,btn){
var done=function(){var o=btn.textContent;btn.textContent=T[lang].ok;btn.classList.add("ok");setTimeout(function(){btn.textContent=T[lang].cp;btn.classList.remove("ok")},1600)};
var fb=function(){try{var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();document.execCommand("copy");document.body.removeChild(a);done()}catch(e){}};
try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else{fb()}}catch(e){fb()}
}
var app=document.getElementById("app");
app.addEventListener("input",function(e){var i=e.target.id;if(i==="fn")S.n=e.target.value;else if(i==="fs")S.s=e.target.value;else if(i==="fl")S.l=e.target.value;else if(i==="fy")S.y=e.target.value;else return;update()});
app.addEventListener("change",function(e){if(e.target.name==="t"){S.t=e.target.value;update()}});
app.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button[data-copy]");if(b)copy(b.getAttribute("data-copy").replace(/&amp;/g,"&").replace(/&lt;/g,"<"),b)});
document.getElementById("langs").addEventListener("click",function(e){var l=e.target.dataset&&e.target.dataset.l;if(l){lang=l;render()}});
app.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest("button");if(!t)return;if(t.id==="nx"&&!t.disabled){St=Math.min(7,St+1)}else if(t.id==="bk"){St=Math.max(0,St-1)}else return;render();window.scrollTo(0,0)});
var nl=(navigator.language||"pl").slice(0,2).toLowerCase();
lang=T[nl]?nl:"pl";
render();
</script>
